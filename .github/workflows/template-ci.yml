name: Lite template verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lite_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lite_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lite_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-auth-placeholder-with-at-least-32-characters
      GUEST_ORDER_TOKEN_SECRET: ci-guest-placeholder-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_STORE_URL: http://localhost:3000
      LICENSE_KEY: ci-placeholder
      LICENSE_PRODUCT: ci-placeholder-not-a-product-id
      LICENSE_SERVER_URL: http://127.0.0.1:9
      LICENSE_SERVER_SECRET: ci-license-placeholder-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.8.2
      - run: npm ci
      - run: npm run manifest:validate
      - run: npm test
      - run: npx tsc --noEmit --incremental false
      - run: npx eslint app components lib scripts tests --ext .ts,.tsx
      - name: Fresh deploy on disposable PostgreSQL only
        run: npm run build
      - name: Repeat create-only initialization
        run: npm run deploy:prepare
      - name: Real database lifecycle and bank-transfer workflow
        run: npx tsx scripts/verify-disposable-db.ts
